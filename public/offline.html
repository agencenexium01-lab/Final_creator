<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0A0A14" />
    <title>Pas de connexion · Creator Booster IA</title>
    <style>
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0A0A14; color: #F1F5F9;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      .mark { width: 48px; height: 48px; margin: 0 auto 20px; border-radius: 12px; background: #7C3AED; display: grid; place-items: center; }
      h1 { font-size: 20px; font-weight: 600; margin: 0; }
      p { color: #94A3B8; margin: 8px 0 24px; line-height: 1.5; }
      button { min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px; background: #fff; color: #0A0A14; font: inherit; font-weight: 500; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 64 64"><path d="M35.5 10 17 36h13l-3.5 18L47 27H34l1.5-17z" fill="#fff" /></svg>
      </div>
      <h1>Pas de connexion Internet</h1>
      <p>Vérifie ta connexion (données mobiles ou Wi-Fi), puis réessaie.<br />Tes contenus sont enregistrés sur ton compte.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
